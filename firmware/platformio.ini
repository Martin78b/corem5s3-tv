[platformio]
default_envs = m5stack-cores3-se

[env:m5stack-cores3-se]
platform = espressif32@6.7.0
board = m5stack-cores3
framework = arduino
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
upload_speed = 460800
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DM5STACK
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -mfix-esp32-psram-cache-issue
    -O2

lib_deps =
    m5stack/M5Unified @ ^0.2.0
    bitbank2/JPEGDEC @ ^1.3.0

[env:generic-esp32-s3-154]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
board_build.psram.enable = true
upload_speed = 460800
upload_protocol = esptool
monitor_speed = 115200

build_flags =
    -DGENERIC_154
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -mfix-esp32-psram-cache-issue
    -O2
    -include boards/tft_154.h

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/JPEGDEC @ ^1.3.0

; Display pins: override boards/tft_154.h or via flags here
; SD card pins (SPI mode): -DSD_CS=4 -DSD_MOSI=11 -DSD_MISO=13 -DSD_SCLK=12
; Audio I2S pins: -DAUDIO_I2S_BCLK=9 -DAUDIO_I2S_WS=0 -DAUDIO_I2S_DOUT=13

[env:waveshare-s3-touch-lcd-154]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv
board_build.psram.enable = true
board_build.psram_type = opi
upload_speed = 460800
upload_protocol = esptool
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder

build_flags =
    -DWAVESHARE_154
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=0
    -mfix-esp32-psram-cache-issue
    -O2
    -DUSE_FSPI_PORT
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_CS=21
    -DTFT_DC=45
    -DTFT_RST=40
    -DTFT_MOSI=39
    -DTFT_SCLK=38
    -DTFT_MISO=-1
    -DTFT_BL=46
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DSMOOTH_FONT

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bitbank2/JPEGDEC @ ^1.3.0
